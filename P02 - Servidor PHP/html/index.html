<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de inscripción</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Inscripción del alumnado</h1>

        <p class="descripcion">
            Introduce tus datos académicos:
        </p>

        <form action="procesar.php" method="POST">

            <div class="grupo">
                <label for="nombre">Nombre y apellidos:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="grupo">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div class="grupo">
                <label>Actividad:</label>

                <div class="seleccion-actividad">
                    <label for="actividad">Selecciona una actividad:</label>
                    <select id="actividad" name="actividad" required>
                        <option value="robótica">Robótica</option>
                        <option value="desarrollovideojuegos">Desarrollo de videojuegos</option>
                        <option value="ciberseguridad">Ciberseguridad</option>
                        <option value="impresion3d">Diseño e impresión 3D</option>
                    </select>
                </div>
            </div>

            <div class="grupo">
                <input type="radio" id="turno" name="turno" value="mañana" required>
                <label for="turno">Turno de mañana</label>
                <input type="radio" id="turno" name="turno" value="tarde" required>
                <label for="turno">Turno de tarde</label>
            </div>

            <div class="opciones">

                <p class="titulo-opciones">
                    Recursos para las prácticas:
                </p>

                <label class="opcion" for="portatil">
                    <input
                        type="checkbox"
                        id="portatil"
                        name="portatil"
                        value="true"
                    >
                    Dispongo de ordenador portátil propio.
                </label>

            </div>

            <div class="botones">
                <button type="submit" class="enviar">
                    Enviar formulario
                </button>

                <button type="reset" class="limpiar">
                    Limpiar
                </button>
            </div>

        </form>

        <p class="nota">
            Los datos introducidos se enviarán al servidor mediante
            el método GET.
        </p>

    </div>

</body>
</html>
